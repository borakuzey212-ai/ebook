[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "public"

# Clean product URLs: /ebooks/<slug> renders product.html, which reads the slug from the path.
[[redirects]]
  from = "/ebooks/*"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
